<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thisara's Robot</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --panel: #f2f2f2;
    --shadow: rgba(0,0,0,0.15);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --fg: #ffffff;
      --panel: #1a1a1a;
      --shadow: rgba(255,255,255,0.12);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    overflow: hidden;
  }
  .stage {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .caption {
    font-size: 14px;
    opacity: 0.6;
    letter-spacing: 0.04em;
    text-align: center;
    max-width: 320px;
  }
  .robot {
    width: 220px;
    height: 220px;
    position: relative;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 60ms linear;
  }
  .antenna {
    position: absolute;
    top: -34px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 30px;
    background: var(--fg);
    border-radius: 2px;
  }
  .antenna::after {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--fg);
    box-shadow: 0 0 12px var(--fg);
  }
  .head {
    width: 100%;
    height: 100%;
    border-radius: 46px;
    background: var(--panel);
    border: 3px solid var(--fg);
    box-shadow: 0 18px 40px var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .ear {
    position: absolute;
    top: 70px;
    width: 14px;
    height: 40px;
    background: var(--fg);
    border-radius: 6px;
  }
  .ear.left { left: -9px; }
  .ear.right { right: -9px; }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
  }
  .eyes {
    display: flex;
    gap: 26px;
  }
  .eye {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--bg);
    border: 3px solid var(--fg);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .pupil {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--fg);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  .eyelid {
    position: absolute;
    left: -3px;
    right: -3px;
    top: -3px;
    height: 0%;
    background: var(--panel);
    border-bottom: 3px solid var(--fg);
    z-index: 2;
  }
  .eyelid.blink {
    animation: blink 160ms ease-in-out;
  }
  @keyframes blink {
    0%   { height: 0%; }
    45%  { height: 110%; }
    100% { height: 0%; }
  }
  .mouth {
    width: 46px;
    height: 14px;
    border: 3px solid var(--fg);
    border-top: none;
    border-radius: 0 0 20px 20px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="robot" id="robot">
      <div class="antenna"></div>
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="head">
        <div class="face">
          <div class="eyes">
            <div class="eye">
              <div class="pupil" data-pupil></div>
              <div class="eyelid" data-eyelid></div>
            </div>
            <div class="eye">
              <div class="pupil" data-pupil></div>
              <div class="eyelid" data-eyelid></div>
            </div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
    </div>
    <div class="caption">Move your mouse around &mdash; I'm watching 👀</div>
  </div>

<script>
  const robot = document.getElementById('robot');
  const pupils = Array.from(document.querySelectorAll('[data-pupil]'));
  const eyelids = Array.from(document.querySelectorAll('[data-eyelid]'));

  const EYE_RADIUS = 13;      // how far a pupil can travel from eye center
  const MAX_TILT = 14;        // max head rotation in degrees

  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  let lastRealInput = 0;

  function setPointerTarget(x, y) {
    targetX = x;
    targetY = y;
    lastRealInput = performance.now();
  }

  window.addEventListener('mousemove', (e) => setPointerTarget(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    if (e.touches[0]) setPointerTarget(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  function idleTarget(t) {
    // gentle figure-eight look-around when nothing is driving the pointer
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    const r = Math.min(window.innerWidth, window.innerHeight) * 0.28;
    return {
      x: cx + Math.sin(t / 1800) * r,
      y: cy + Math.sin(t / 900) * r * 0.5
    };
  }

  function tick(t) {
    const idle = performance.now() - lastRealInput > 3000;
    const point = idle ? idleTarget(t) : { x: targetX, y: targetY };

    const rect = robot.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const dx = point.x - cx;
    const dy = point.y - cy;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = dx / dist;
    const ny = dy / dist;

    const pupilOffsetX = nx * EYE_RADIUS;
    const pupilOffsetY = ny * EYE_RADIUS;
    pupils.forEach((p) => {
      p.style.transform = `translate(calc(-50% + ${pupilOffsetX}px), calc(-50% + ${pupilOffsetY}px))`;
    });

    const tilt = Math.max(-1, Math.min(1, dx / (window.innerWidth / 2))) * MAX_TILT;
    const tiltY = Math.max(-1, Math.min(1, dy / (window.innerHeight / 2))) * (MAX_TILT * 0.5);
    robot.style.transform = `rotate(${tilt * 0.3}deg) rotateX(${-tiltY}deg) rotateY(${tilt}deg)`;

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function scheduleBlink() {
    const delay = 2200 + Math.random() * 3200;
    setTimeout(() => {
      eyelids.forEach((el) => {
        el.classList.remove('blink');
        // restart animation
        void el.offsetWidth;
        el.classList.add('blink');
      });
      scheduleBlink();
    }, delay);
  }
  scheduleBlink();
</script>
</body>
</html>
