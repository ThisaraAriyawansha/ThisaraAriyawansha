<svg width="180" height="176" viewBox="98 0 164 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blinking robot face">
  <defs>
    <linearGradient id="bodyGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glowL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="118" y="18" width="124" height="122" rx="46" fill="url(#bodyGradL)" stroke="#000" stroke-width="2"/>
  <path d="M138,40 C160,30 210,28 224,45" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>

  <rect x="140" y="62" width="80" height="36" rx="14" fill="#040404"/>

  <g>
    <g>
      <rect x="152" y="72" width="17" height="15" rx="4" fill="#eaffff" filter="url(#glowL)"/>
      <rect x="191" y="72" width="17" height="15" rx="4" fill="#eaffff" filter="url(#glowL)"/>
    </g>

    <g fill="#040404">
      <rect x="150" y="72" width="21" height="0" rx="4">
        <animate attributeName="height" values="0;0;15;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="189" y="72" width="21" height="0" rx="4">
        <animate attributeName="height" values="0;0;15;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 6,0; 6,0; -6,-2; -6,-2; 0,3; 0,3; 0,0"
      keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1"
      dur="6s" repeatCount="indefinite"/>
  </g>
</svg>
