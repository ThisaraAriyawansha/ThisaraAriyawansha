<svg width="180" height="180" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tech robot face">
  <defs>
    <linearGradient id="bodyGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="55%" stop-color="#cfcfcf"/>
      <stop offset="100%" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="visorGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glowL" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 3,0; 3,0; -3,-1; -3,-1; 0,2; 0,2; 0,0"
      keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1"
      dur="6s" repeatCount="indefinite"/>

    <!-- antenna -->
    <line x1="100" y1="20" x2="100" y2="4" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="100" cy="4" r="5" fill="#00e5ff" filter="url(#glowL)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- head plate (octagon) -->
    <path d="M52,20 L148,20 L170,42 L170,128 L148,150 L52,150 L30,128 L30,42 Z"
      fill="url(#bodyGradL)" stroke="#050505" stroke-width="2.5"/>

    <!-- panel seam -->
    <line x1="40" y1="46" x2="160" y2="46" stroke="#050505" stroke-opacity="0.15" stroke-width="2"/>

    <!-- corner rivets -->
    <circle cx="44" cy="34" r="3" fill="#7a7a7a" stroke="#050505" stroke-width="1"/>
    <circle cx="156" cy="34" r="3" fill="#7a7a7a" stroke="#050505" stroke-width="1"/>
    <circle cx="44" cy="136" r="3" fill="#7a7a7a" stroke="#050505" stroke-width="1"/>
    <circle cx="156" cy="136" r="3" fill="#7a7a7a" stroke="#050505" stroke-width="1"/>

    <!-- circuit traces -->
    <path d="M36,100 L48,100 L48,112" fill="none" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="112" r="2.4" fill="#00e5ff" fill-opacity="0.7"/>
    <path d="M164,100 L152,100 L152,112" fill="none" stroke="#00e5ff" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <circle cx="152" cy="112" r="2.4" fill="#00e5ff" fill-opacity="0.7"/>

    <!-- visor / HUD screen -->
    <rect x="50" y="62" width="100" height="46" rx="10" fill="url(#visorGradL)" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5"/>

    <g>
      <g>
        <rect x="63" y="76" width="20" height="17" rx="4" fill="#00e5ff" filter="url(#glowL)"/>
        <rect x="117" y="76" width="20" height="17" rx="4" fill="#00e5ff" filter="url(#glowL)"/>
      </g>
      <g fill="#050505">
        <rect x="61" y="76" width="24" height="0" rx="4">
          <animate attributeName="height" values="0;0;17;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="115" y="76" width="24" height="0" rx="4">
          <animate attributeName="height" values="0;0;17;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- speaker grill mouth -->
    <g fill="#050505" fill-opacity="0.6">
      <rect x="90" y="122" width="4" height="10" rx="1.5"/>
      <rect x="98" y="122" width="4" height="10" rx="1.5"/>
      <rect x="106" y="122" width="4" height="10" rx="1.5"/>
    </g>
  </g>
</svg>
