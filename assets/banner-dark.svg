<svg width="100%" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thisara Ariyawansha banner">

  <!-- brush-stroke stripes -->
  <rect x="300" y="42" width="480" height="58" rx="6" fill="#2a2a2a" transform="rotate(-6 540 71)"/>
  <rect x="300" y="168" width="480" height="58" rx="6" fill="#2a2a2a" transform="rotate(5 540 197)"/>

  <!-- left role text -->
  <text x="30" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6e6e6">Undergraduate Student</text>
  <text x="30" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Software Engineer</text>

  <!-- badge chip -->
  <rect x="30" y="188" width="192" height="34" rx="17" fill="#ffffff"/>
  <text x="126" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle" letter-spacing="0.5">STUDENT AT NIBM</text>

  <!-- center illustration -->
  <svg x="390" y="10" width="220" height="220" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="bannerBodyCD" x1="0.2" y1="0" x2="0.8" y2="1">
        <stop offset="0%" stop-color="#f0f1f3"/>
        <stop offset="100%" stop-color="#b6b9be"/>
      </linearGradient>
      <radialGradient id="bannerGlossCD" cx="0.32" cy="0.22" r="0.55">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <filter id="bannerScreenGlowD" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="1.6" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <pattern id="bannerBarsD" width="5" height="22" patternUnits="userSpaceOnUse">
        <rect width="5" height="22" fill="#08090b"/>
        <rect width="2.4" height="22" fill="#f4f6f8"/>
      </pattern>
      <clipPath id="bannerHeadClipD">
        <rect x="38" y="38" width="124" height="128" rx="52"/>
      </clipPath>
    </defs>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0; 1.5,0; 1.5,0; -1.5,-0.6; -1.5,-0.6; 0,0.8; 0,0.8; 0,0"
        keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1" dur="6.5s" repeatCount="indefinite"/>

      <rect x="38" y="38" width="124" height="128" rx="52" fill="url(#bannerBodyCD)" stroke="#9a9ea3" stroke-width="2"/>
      <ellipse cx="80" cy="65" rx="46" ry="30" fill="url(#bannerGlossCD)" clip-path="url(#bannerHeadClipD)"/>

      <ellipse cx="26" cy="112" rx="15" ry="24" fill="url(#bannerBodyCD)" stroke="#9a9ea3" stroke-width="1.5"/>
      <ellipse cx="174" cy="112" rx="15" ry="24" fill="url(#bannerBodyCD)" stroke="#9a9ea3" stroke-width="1.5"/>

      <path d="M64,48 C58,30 66,18 80,24 C82,36 78,46 72,54 Z" fill="url(#bannerBodyCD)" stroke="#9a9ea3" stroke-width="1.5"/>
      <path d="M136,48 C142,30 134,18 120,24 C118,36 122,46 128,54 Z" fill="url(#bannerBodyCD)" stroke="#9a9ea3" stroke-width="1.5"/>

      <rect x="58" y="70" width="84" height="78" rx="24" fill="#08090b"/>
      <rect x="58" y="70" width="84" height="16" rx="8" fill="#ffffff" opacity="0.05"/>

      <g filter="url(#bannerScreenGlowD)">
        <rect x="70" y="96" width="20" height="16" rx="2" fill="url(#bannerBarsD)"/>
        <rect x="104" y="100" width="22" height="6" rx="3" fill="#f4f6f8"/>

        <g fill="#f4f6f8">
          <rect x="76" y="126" width="8" height="4" rx="2"/>
          <rect x="87" y="130" width="10" height="4" rx="2"/>
          <rect x="100" y="131" width="10" height="4" rx="2"/>
          <rect x="112" y="128" width="10" height="4" rx="2"/>
          <rect x="124" y="123" width="8" height="4" rx="2"/>
        </g>
      </g>
    </g>
  </svg>

  <!-- right name -->
  <text x="970" y="100" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Thisara</text>
  <text x="970" y="140" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Ariyawansha</text>
  <text x="970" y="166" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#aaaaaa">@thisaraariyawansha</text>
</svg>
