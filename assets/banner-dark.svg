<svg width="100%" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thisara Ariyawansha banner">

  <!-- brush-stroke stripes -->
  <rect x="300" y="42" width="480" height="58" rx="6" fill="#2a2a2a" transform="rotate(-6 540 71)"/>
  <rect x="300" y="168" width="480" height="58" rx="6" fill="#2a2a2a" transform="rotate(5 540 197)"/>

  <!-- left role text -->
  <text x="30" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#e6e6e6">Undergraduate Student</text>
  <text x="30" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Software Engineer</text>

  <!-- badge chip -->
  <rect x="30" y="188" width="192" height="34" rx="17" fill="#ffffff"/>
  <text x="126" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle" letter-spacing="0.5">STUDENT AT NIBM</text>

  <!-- center illustration -->
  <svg x="390" y="10" width="220" height="220" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="bannerBodyGradD" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#eceef0"/>
        <stop offset="100%" stop-color="#b9bcc0"/>
      </linearGradient>
      <linearGradient id="bannerVisorGradD" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2b2f3a"/>
        <stop offset="100%" stop-color="#0e0f14"/>
      </linearGradient>
      <filter id="bannerGlowD" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum"
        values="0,0; 3,0; 3,0; -3,-1; -3,-1; 0,2; 0,2; 0,0"
        keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1"
        dur="6s" repeatCount="indefinite"/>

      <path d="M122,28 L129,11" fill="none" stroke="#a8adb3" stroke-width="3" stroke-linecap="round"/>
      <circle cx="129" cy="11" r="5" fill="#e6e8ea" stroke="#a8adb3" stroke-width="1.5"/>

      <rect x="35" y="25" width="130" height="130" rx="48" fill="url(#bannerBodyGradD)" stroke="#9aa0a6" stroke-width="2"/>

      <rect x="60" y="62" width="80" height="64" rx="28" fill="url(#bannerVisorGradD)"/>

      <g>
        <g>
          <ellipse cx="84" cy="94" rx="9" ry="11" fill="#33e6d4" filter="url(#bannerGlowD)"/>
          <ellipse cx="116" cy="94" rx="9" ry="11" fill="#33e6d4" filter="url(#bannerGlowD)"/>
        </g>
        <g fill="#0e0f14">
          <rect x="74" y="83" width="20" height="0" rx="9">
            <animate attributeName="height" values="0;0;22;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
          </rect>
          <rect x="106" y="83" width="20" height="0" rx="9">
            <animate attributeName="height" values="0;0;22;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>

      <path d="M87,140 Q100,150 113,140" fill="none" stroke="#33e6d4" stroke-width="4" stroke-linecap="round"/>
    </g>
  </svg>

  <!-- right name -->
  <text x="970" y="100" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Thisara</text>
  <text x="970" y="140" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Ariyawansha</text>
  <text x="970" y="166" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-style="italic" fill="#aaaaaa">@thisaraariyawansha</text>
</svg>
