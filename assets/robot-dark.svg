<svg width="180" height="180" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute robot face">
  <defs>
    <linearGradient id="bodyGradD" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f0f1f3"/>
      <stop offset="100%" stop-color="#b6b9be"/>
    </linearGradient>
    <radialGradient id="glossGradD" cx="0.32" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="screenGlowD" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="headClipD">
      <rect x="38" y="38" width="124" height="128" rx="52"/>
    </clipPath>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 1.5,0; 1.5,0; -1.5,-0.6; -1.5,-0.6; 0,0.8; 0,0.8; 0,0"
      keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1" dur="6.5s" repeatCount="indefinite"/>

    <rect x="38" y="38" width="124" height="128" rx="52" fill="url(#bodyGradD)" stroke="#9a9ea3" stroke-width="2"/>
    <ellipse cx="80" cy="65" rx="46" ry="30" fill="url(#glossGradD)" clip-path="url(#headClipD)"/>

    <ellipse cx="26" cy="112" rx="15" ry="24" fill="url(#bodyGradD)" stroke="#9a9ea3" stroke-width="1.5"/>
    <ellipse cx="174" cy="112" rx="15" ry="24" fill="url(#bodyGradD)" stroke="#9a9ea3" stroke-width="1.5"/>

    <path d="M64,48 C58,30 66,18 80,24 C82,36 78,46 72,54 Z" fill="url(#bodyGradD)" stroke="#9a9ea3" stroke-width="1.5"/>
    <path d="M136,48 C142,30 134,18 120,24 C118,36 122,46 128,54 Z" fill="url(#bodyGradD)" stroke="#9a9ea3" stroke-width="1.5"/>

    <rect x="58" y="70" width="84" height="78" rx="24" fill="#08090b"/>
    <rect x="58" y="70" width="84" height="16" rx="8" fill="#ffffff" opacity="0.05"/>

    <!-- eyes -->
    <g filter="url(#screenGlowD)" fill="#f4f6f8">
      <g transform="translate(78,104)"><circle r="11">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,1;1,0.08;1,1;1,1" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
      </circle></g>
      <g transform="translate(122,104)"><circle r="11">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,1;1,0.08;1,1;1,1" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
      </circle></g>
    </g>

    <!-- talking mouth -->
    <g filter="url(#screenGlowD)" fill="#f4f6f8">
      <g transform="translate(80,130)"><rect x="-4" y="-4" width="8" height="4" rx="2">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.3;1,1.4;1,0.6;1,1" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" repeatCount="indefinite"/>
      </rect></g>
      <g transform="translate(92,134)"><rect x="-5" y="-4" width="10" height="4" rx="2">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.3;1,1.4;1,0.6;1,1" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0.15s" repeatCount="indefinite"/>
      </rect></g>
      <g transform="translate(105,135)"><rect x="-5" y="-4" width="10" height="4" rx="2">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.3;1,1.4;1,0.6;1,1" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
      </rect></g>
      <g transform="translate(117,132)"><rect x="-5" y="-4" width="10" height="4" rx="2">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.3;1,1.4;1,0.6;1,1" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0.45s" repeatCount="indefinite"/>
      </rect></g>
      <g transform="translate(128,127)"><rect x="-4" y="-4" width="8" height="4" rx="2">
        <animateTransform attributeName="transform" type="scale" values="1,1;1,0.3;1,1.4;1,0.6;1,1" keyTimes="0;0.25;0.5;0.75;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
      </rect></g>
    </g>
  </g>
</svg>
