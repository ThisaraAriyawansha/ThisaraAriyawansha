<svg width="180" height="180" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute robot face">
  <defs>
    <linearGradient id="bodyGradD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eceef0"/>
      <stop offset="100%" stop-color="#b9bcc0"/>
    </linearGradient>
    <linearGradient id="visorGradD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2f3a"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>
    <filter id="glowD" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 3,0; 3,0; -3,-1; -3,-1; 0,2; 0,2; 0,0"
      keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1"
      dur="6s" repeatCount="indefinite"/>

    <!-- antenna -->
    <path d="M128,32 L136,14" fill="none" stroke="#a8adb3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="136" cy="14" r="4.5" fill="#e6e8ea" stroke="#a8adb3" stroke-width="1.5"/>

    <!-- ears -->
    <circle cx="34" cy="100" r="12" fill="url(#bodyGradD)" stroke="#9aa0a6" stroke-width="1.5"/>
    <circle cx="166" cy="100" r="12" fill="url(#bodyGradD)" stroke="#9aa0a6" stroke-width="1.5"/>

    <!-- head -->
    <rect x="40" y="30" width="120" height="120" rx="46" fill="url(#bodyGradD)" stroke="#9aa0a6" stroke-width="2"/>

    <!-- visor -->
    <rect x="65" y="68" width="70" height="56" rx="24" fill="url(#visorGradD)"/>

    <g>
      <g>
        <ellipse cx="86" cy="96" rx="8" ry="10" fill="#33e6d4" filter="url(#glowD)"/>
        <ellipse cx="114" cy="96" rx="8" ry="10" fill="#33e6d4" filter="url(#glowD)"/>
      </g>
      <g fill="#0e0f14">
        <rect x="77" y="86" width="18" height="0" rx="8">
          <animate attributeName="height" values="0;0;20;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="105" y="86" width="18" height="0" rx="8">
          <animate attributeName="height" values="0;0;20;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- mouth -->
    <path d="M92,136 Q100,142 108,136" fill="none" stroke="#33e6d4" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
