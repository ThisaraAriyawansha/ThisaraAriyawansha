<svg width="180" height="180" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute robot face">
  <defs>
    <linearGradient id="bodyGradD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eceef0"/>
      <stop offset="100%" stop-color="#b9bcc0"/>
    </linearGradient>
    <linearGradient id="visorGradD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2f3a"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>
    <filter id="glowD" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0,0; 3,0; 3,0; -3,-1; -3,-1; 0,2; 0,2; 0,0"
      keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1"
      dur="6s" repeatCount="indefinite"/>

    <!-- antenna -->
    <path d="M122,28 L129,11" fill="none" stroke="#a8adb3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="129" cy="11" r="5" fill="#e6e8ea" stroke="#a8adb3" stroke-width="1.5"/>

    <!-- head -->
    <rect x="35" y="25" width="130" height="130" rx="48" fill="url(#bodyGradD)" stroke="#9aa0a6" stroke-width="2"/>

    <!-- visor -->
    <rect x="60" y="62" width="80" height="64" rx="28" fill="url(#visorGradD)"/>

    <g>
      <g>
        <ellipse cx="84" cy="94" rx="9" ry="11" fill="#33e6d4" filter="url(#glowD)"/>
        <ellipse cx="116" cy="94" rx="9" ry="11" fill="#33e6d4" filter="url(#glowD)"/>
      </g>
      <g fill="#0e0f14">
        <rect x="74" y="83" width="20" height="0" rx="9">
          <animate attributeName="height" values="0;0;22;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="106" y="83" width="20" height="0" rx="9">
          <animate attributeName="height" values="0;0;22;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="4.5s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- mouth -->
    <path d="M87,140 Q100,150 113,140" fill="none" stroke="#33e6d4" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
